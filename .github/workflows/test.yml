name: native-extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build portable native extension
        run: JOBS=2 bash scripts/build.sh
      - name: Download official CLI
        run: |
          curl -fL https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip -o "$RUNNER_TEMP/duckdb.zip"
          unzip "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb-cli"
      - name: Python and CLI integration tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          DUCKDB_CLI="$RUNNER_TEMP/duckdb-cli/duckdb" .venv/bin/python -m unittest discover -s tests -v
      - name: Official CLI, two independent processes
        run: |
          python scripts/render_examples.py
          # DuckDB 1.5's friendly CLI suppresses query output for piped stdin;
          # -f prints results and still fails on errors.
          "$RUNNER_TEMP/duckdb-cli/duckdb" -unsigned "$RUNNER_TEMP/context.duckdb" -f build/examples/setup.sql
          "$RUNNER_TEMP/duckdb-cli/duckdb" -unsigned -readonly "$RUNNER_TEMP/context.duckdb" -f build/examples/reopen.sql
      - name: Upload tested extension
        uses: actions/upload-artifact@v4
        with:
          name: mcp_context-duckdb-v1.5.5-linux-amd64
          path: build/extension/mcp_context/mcp_context.duckdb_extension
          if-no-files-found: error
